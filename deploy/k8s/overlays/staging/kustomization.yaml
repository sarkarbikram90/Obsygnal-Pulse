apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: obsygnal-pulse-staging

resources:
  - ../../base

configMapGenerator:
  - name: obsygnal-pulse-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - CORS_ALLOWED_ORIGINS=https://staging.pulse.obsygnal.com

images:
  - name: ghcr.io/sarkarbikram90/obsygnal-api-server
    newTag: develop
  - name: ghcr.io/sarkarbikram90/obsygnal-worker
    newTag: develop
  - name: ghcr.io/sarkarbikram90/obsygnal-web
    newTag: develop
  - name: ghcr.io/sarkarbikram90/obsygnal-agent
    newTag: develop
