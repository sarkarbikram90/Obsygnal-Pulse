apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: obsygnal-pulse-prod

resources:
  - ../../base

patchesStrategicMerge:
  - replica_count.yaml

configMapGenerator:
  - name: obsygnal-pulse-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - CORS_ALLOWED_ORIGINS=https://pulse.obsygnal.com

images:
  - name: ghcr.io/sarkarbikram90/obsygnal-api-server
    newTag: v1.0.0
  - name: ghcr.io/sarkarbikram90/obsygnal-worker
    newTag: v1.0.0
  - name: ghcr.io/sarkarbikram90/obsygnal-web
    newTag: v1.0.0
  - name: ghcr.io/sarkarbikram90/obsygnal-agent
    newTag: v1.0.0
