apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: obsygnal-pulse
  labels:
    app: obsygnal-pulse
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: obsygnal-pulse
      component: worker
  template:
    metadata:
      labels:
        app: obsygnal-pulse
        component: worker
    spec:
      serviceAccountName: obsygnal-pulse-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: ghcr.io/sarkarbikram90/obsygnal-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: obsygnal-pulse-config
            - secretRef:
                name: obsygnal-pulse-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
