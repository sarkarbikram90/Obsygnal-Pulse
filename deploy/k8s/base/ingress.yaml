apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obsygnal-pulse-ingress
  namespace: obsygnal-pulse
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: obsygnal-pulse-tls
      hosts:
        - pulse.obsygnal.com
  rules:
    - host: pulse.obsygnal.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
