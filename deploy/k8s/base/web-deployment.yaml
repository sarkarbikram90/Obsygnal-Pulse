apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: obsygnal-pulse
  labels:
    app: obsygnal-pulse
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: obsygnal-pulse
      component: web
  template:
    metadata:
      labels:
        app: obsygnal-pulse
        component: web
    spec:
      serviceAccountName: obsygnal-pulse-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: web
          image: ghcr.io/sarkarbikram90/obsygnal-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: obsygnal-pulse
  labels:
    app: obsygnal-pulse
    component: web
spec:
  selector:
    app: obsygnal-pulse
    component: web
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
