apiVersion: v1
kind: Namespace
metadata:
  name: obsygnal-pulse
  labels:
    app.kubernetes.io/name: obsygnal-pulse
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: obsygnal-pulse
  labels:
    app: obsygnal-pulse
    component: api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: obsygnal-pulse
      component: api-server
  template:
    metadata:
      labels:
        app: obsygnal-pulse
        component: api-server
    spec:
      serviceAccountName: obsygnal-pulse-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api-server
          image: ghcr.io/sarkarbikram90/obsygnal-api-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: obsygnal-pulse-config
            - secretRef:
                name: obsygnal-pulse-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: obsygnal-pulse
spec:
  selector:
    app: obsygnal-pulse
    component: api-server
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obsygnal-pulse-config
  namespace: obsygnal-pulse
data:
  ENVIRONMENT: "production"
  SERVER_PORT: "8080"
  CLICKHOUSE_HOST: "clickhouse.obsygnal-pulse.svc.cluster.local"
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_DATABASE: "obsygnal"
  REDIS_HOST: "redis.obsygnal-pulse.svc.cluster.local"
  REDIS_PORT: "6379"
  NATS_URL: "nats://nats.obsygnal-pulse.svc.cluster.local:4222"
  CORS_ALLOWED_ORIGINS: "https://pulse.obsygnal.com"
  DETECTION_GPU_UTIL_THRESHOLD: "20"
  DETECTION_MEM_UTIL_THRESHOLD: "15"
  DETECTION_EVALUATION_INTERVAL: "60s"
