apiVersion: v2
name: obsygnal-pulse
description: AI Infrastructure Efficiency Platform — GPU telemetry, inefficiency detection, and optimization recommendations
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: Obsygnal Team
    email: engineering@obsygnal.io
keywords:
  - gpu
  - observability
  - mlops
  - kubernetes
  - ai-infrastructure
dependencies:
  - name: clickhouse
    version: ">=4.0.0"
    repository: "https://charts.clickhouse.com"
    condition: clickhouse.enabled
  - name: redis
    version: ">=17.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: prometheus
    version: ">=25.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
