# Default values for obsygnal-pulse.
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: obsygnal/obsygnal-pulse
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: pulse.obsygnal.io
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Sub-chart toggles
clickhouse:
  enabled: true
redis:
  enabled: true
prometheus:
  enabled: true
nats:
  enabled: true
  nats:
    jetstream:
      enabled: true

# Application config
config:
  environment: production
  detection:
    gpuUtilizationThreshold: 20
    memoryUtilizationThreshold: 15
    evaluationInterval: 60s
  alerting:
    slackWebhookURL: ""
    deduplicationWindow: 15m
    rateLimitPerMinute: 10
  nats:
    url: "nats://obsygnal-pulse-nats:4222"
    streamName: "telemetry"
    maxRetries: 3
