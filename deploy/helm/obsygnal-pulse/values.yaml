# Default Helm values for Obsygnal-Pulse deployment

global:
  environment: production
  orgId: "org_enterprise_01"

# Agent DaemonSet values
agent:
  enabled: true
  image:
    repository: ghcr.io/sarkarbikram90/obsygnal-agent
    tag: latest
    pullPolicy: IfNotPresent
  apiKey: "obsygnal_sec_production_agent_key"
  scrapeInterval: 15s
  prometheusUrl: "http://prometheus-k8s.monitoring.svc:9090"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    accelerator: nvidia-gpu

# Control Plane API Server values
server:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/sarkarbikram90/obsygnal-api-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  env:
    SERVER_ENVIRONMENT: production
    CLICKHOUSE_HOST: "clickhouse.obsygnal.svc"
    CLICKHOUSE_PORT: "9000"
    REDIS_HOST: "redis.obsygnal.svc"
    REDIS_PORT: "6379"
