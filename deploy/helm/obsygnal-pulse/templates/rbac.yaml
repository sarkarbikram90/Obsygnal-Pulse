{{- if .Values.agent.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "obsygnal-pulse.fullname" . }}-agent-role
  labels:
    {{- include "obsygnal-pulse.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "obsygnal-pulse.fullname" . }}-agent-binding
  labels:
    {{- include "obsygnal-pulse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "obsygnal-pulse.fullname" . }}-agent-role
subjects:
  - kind: ServiceAccount
    name: {{ include "obsygnal-pulse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
