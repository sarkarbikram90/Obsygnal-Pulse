apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "obsygnal-pulse.fullname" . }}-config
  labels:
    {{- include "obsygnal-pulse.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  CLICKHOUSE_HOST: {{ .Values.config.clickhouseHost | quote }}
  CLICKHOUSE_PORT: {{ .Values.config.clickhousePort | quote }}
  CLICKHOUSE_DATABASE: {{ .Values.config.clickhouseDatabase | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  NATS_URL: {{ .Values.config.natsUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  DETECTION_GPU_UTIL_THRESHOLD: {{ .Values.config.detectionGpuThreshold | quote }}
  DETECTION_MEM_UTIL_THRESHOLD: {{ .Values.config.detectionMemThreshold | quote }}
  DETECTION_EVALUATION_INTERVAL: {{ .Values.config.detectionEvaluationInterval | quote }}
