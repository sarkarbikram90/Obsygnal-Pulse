apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obsygnal-pulse.fullname" . }}-secrets
  labels:
    {{- include "obsygnal-pulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  CLICKHOUSE_USER: {{ .Values.secrets.clickhouseUser | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.secrets.clickhousePassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  OBSYGNAL_API_KEY: {{ .Values.agent.apiKey | quote }}
