# Prometheus configuration for Obsygnal-Pulse local development
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Obsygnal-Pulse API server metrics
  - job_name: 'obsygnal-api'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Obsygnal-Pulse Simulator (fake GPU metrics)
  - job_name: 'obsygnal-simulator'
    static_configs:
      - targets: ['host.docker.internal:8085']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # In production, these would target DCGM exporter and node exporter:
  # - job_name: 'dcgm-exporter'
  #   kubernetes_sd_configs:
  #     - role: pod
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_pod_label_app]
  #       regex: dcgm-exporter
  #       action: keep
