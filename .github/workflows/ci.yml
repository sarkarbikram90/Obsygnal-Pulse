name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.24'

jobs:
  # ============================================================
  # Lint
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Go files are not formatted. Run 'gofmt -w .'"
            gofmt -l .
            exit 1
          fi

  # ============================================================
  # Test
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/...
        env:
          ENVIRONMENT: test

      - name: Run test/ package tests
        run: go test -v ./test/...
        env:
          ENVIRONMENT: test

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "::warning::Coverage ${COVERAGE}% is below 50% target."
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

  # ============================================================
  # Build
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all binaries
        run: |
          CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/api-server ./cmd/api-server/
          CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/simulator ./cmd/simulator/
          CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/collector ./cmd/collector/
          CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/worker ./cmd/worker/

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: bin/

  # ============================================================
  # Docker Build
  # ============================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker images
        run: |
          docker build -f deploy/docker/api-server.Dockerfile \
            --build-arg SERVICE=api-server \
            -t obsygnal-pulse/api-server:${{ github.sha }} .

          docker build -f deploy/docker/api-server.Dockerfile \
            --build-arg SERVICE=simulator \
            -t obsygnal-pulse/simulator:${{ github.sha }} .

      - name: Verify images
        run: |
          docker images | grep obsygnal-pulse

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
