name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Auto-cancel outdated workflow runs on push to PR branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Strict Least-Privilege Security Posture
permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  GOPROXY: 'https://proxy.golang.org,direct'

jobs:
  # ============================================================
  # Lint & Code Hygiene
  # ============================================================
  lint:
    name: Lint & Code Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod & go.sum hygiene
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "::error::go.mod or go.sum is not tidied. Run 'go mod tidy' locally." && exit 1)

      - name: Run go vet
        run: go vet -mod=mod ./...

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::warning::The following Go files need formatting:"
            echo "$UNFORMATTED"
          fi

      - name: Helm Chart Linting
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint deploy/helm/obsygnal-pulse

  # ============================================================
  # Test & Coverage
  # ============================================================
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with Race Detector
        run: go test -mod=mod -v -race -coverprofile=coverage.out -covermode=atomic ./internal/...
        env:
          ENVIRONMENT: test

      - name: Run E2E & package tests
        run: go test -mod=mod -v ./test/...
        env:
          ENVIRONMENT: test

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "::warning::Coverage ${COVERAGE}% is below 90% target."
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

  # ============================================================
  # Build Binaries
  # ============================================================
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build static binaries
        run: |
          CGO_ENABLED=0 go build -mod=mod -ldflags="-w -s" -o bin/api-server ./cmd/api-server/
          CGO_ENABLED=0 go build -mod=mod -ldflags="-w -s" -o bin/simulator ./cmd/simulator/
          CGO_ENABLED=0 go build -mod=mod -ldflags="-w -s" -o bin/collector ./cmd/collector/
          CGO_ENABLED=0 go build -mod=mod -ldflags="-w -s" -o bin/worker ./cmd/worker/

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: bin/

  # ============================================================
  # Docker Build & Vulnerability Scan
  # ============================================================
  docker:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Server Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api-server
          tags: obsygnal-pulse/api-server:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: worker
          tags: obsygnal-pulse/worker:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Collector Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: collector
          tags: obsygnal-pulse/collector:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: web
          tags: obsygnal-pulse/web:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Simulator Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: simulator
          tags: obsygnal-pulse/simulator:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API Server Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'obsygnal-pulse/api-server:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================
  # Frontend Build & Typecheck
  # ============================================================
  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production bundle build
        run: npm run build
