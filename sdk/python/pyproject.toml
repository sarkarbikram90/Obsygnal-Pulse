[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obsygnal-pulse"
version = "0.1.0"
description = "Python SDK for Obsygnal-Pulse AI Infrastructure Observability & GPU Efficiency Engine"
readme = "README.md"
authors = [{ name = "Obsygnal Labs", email = "engineering@obsygnal.io" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/sarkarbikram90/Obsygnal-Pulse"
Documentation = "https://github.com/sarkarbikram90/Obsygnal-Pulse#readme"
Repository = "https://github.com/sarkarbikram90/Obsygnal-Pulse.git"
"Bug Tracker" = "https://github.com/sarkarbikram90/Obsygnal-Pulse/issues"
