# .golangci.yml - Configures the strict static analysis pipeline for the CI/CD workflow.
# It enforces security scanning (gosec), dead code elimination, and strict formatting
# across the Go microservices to ensure production-grade codebase health.
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - gosec
    - prealloc

linters-settings:
  errcheck:
    check-blank: true
  govet:
    check-shadowing: false
  gosec:
    severity: medium
    confidence: medium

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    - path: cmd/simulator/
      linters:
        - gosec
